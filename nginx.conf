# Serves the built Vite SPA. Mirrors the behaviour vercel.json gives us in
# production, so both hosts route identically.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Vite fingerprints everything under /assets/, so those URLs are immutable —
    # a new build produces new filenames and can never collide with a cached one.
    # Single Cache-Control header on purpose: nginx's `expires` directive emits
    # its own, which would leave two conflicting headers on every asset.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # The entry point must never be cached, or browsers keep loading the old
    # bundle references after a deploy and the site appears not to update.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # SPA fallback — the equivalent of vercel.json's
    #   { "source": "/(.*)", "destination": "/index.html" }
    # React Router owns /about, /gallery, /admissions and /contact; those paths
    # have no file on disk, so without this a refresh or direct link 404s.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cheap, unauthenticated liveness probe for the deploy workflow and the
    # container healthcheck — avoids shipping the full HTML just to test "up".
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
